name: University Scheduler CI

on:
  push:
    branches: [ main, ahmed-khalil ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Restore dependencies
        run: dotnet restore Backend/Backend.csproj
        
      - name: Build
        run: dotnet build Backend/Backend.csproj --no-restore --configuration Release

      - name: Run Tests
        run: |
          if [ -d "Backend.Tests" ]; then
            dotnet test Backend.Tests/Backend.Tests.csproj --no-build --configuration Release
          else
            echo "No test project found yet."
          fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: cd Frontend && npm install
        
      - name: Build
        run: cd Frontend && npm run build
